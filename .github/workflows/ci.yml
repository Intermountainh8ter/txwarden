name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: tests with coverage (fails under 90%)
        run: pytest -q --cov --cov-report=term --cov-report=json:coverage.json
      - name: eval cases are current
        run: python evals/build_cases.py --check
      - name: eval gate (thresholds sit slightly below the measured values)
        run: |
          python evals/run_evals.py --no-categories --min-accuracy 0.97 --max-unsafe-allow 20 --max-over-block 20
          python evals/run_evals.py --split heldout --no-categories --min-accuracy 0.97
      - name: prompt-injection invariant
        run: python evals/injection_eval.py
      - name: generated docs are current
        if: matrix.python == '3.13'
        run: |
          python scripts/gen_rules_doc.py --check
          python scripts/update_readme.py --check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t txwarden .
      - run: docker run --rm txwarden review /app/examples/approve_unlimited.json --no-llm || test $? -eq 2

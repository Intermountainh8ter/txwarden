[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txwarden"
version = "0.2.0"
description = "LLM agent that simulates Ethereum transactions, scores MEV/approval/phishing risk deterministically, and refuses unsafe calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ammon Jackson" }]
keywords = ["ethereum", "mev", "security", "simulation", "uniswap", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Intermountainh8ter/txwarden"
Source = "https://github.com/Intermountainh8ter/txwarden"
Issues = "https://github.com/Intermountainh8ter/txwarden/issues"
Changelog = "https://github.com/Intermountainh8ter/txwarden/blob/main/CHANGELOG.md"

[project.scripts]
txwarden = "txwarden.cli:main"
txwarden-mcp = "txwarden.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
txwarden = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires TXWARDEN_LIVE_RPC (skipped by default)"]

[tool.coverage.run]
source = ["txwarden"]
branch = true
omit = ["*/__main__.py"]  # three-line shim, exercised through a subprocess in test_integration.py

[tool.coverage.report]
show_missing = false
fail_under = 90
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# explicit so results do not drift with the installed ruff version's defaults
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PERF", "RUF"]
ignore = ["B905"]  # zip(strict=) is deliberately not required; lengths are checked explicitly

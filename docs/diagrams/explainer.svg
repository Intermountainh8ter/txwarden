<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='862' viewBox='0 0 1000 862' font-family='Inter, Helvetica Neue, Arial, sans-serif'>
<rect width='100%' height='100%' fill='#ffffff'/>
<rect x='0' y='0' width='1000' height='7' fill='#1d4ed8'/>
<text x='44.0' y='64.0' font-size='34' font-weight='700' fill='#13161a' text-anchor='start'>txwarden</text>
<text x='44.0' y='90.0' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>Can an attacker talk the safety checker into approving a bad transaction?</text>
<line x1='44.0' y1='106.0' x2='956.0' y2='106.0' stroke='#e3e7ec' stroke-width='1.5'/>
<text x='44.0' y='140.0' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>THE QUESTION</text>
<text x='44.0' y='180.4' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>An AI assistant reviews cryptocurrency transactions and says</text>
<text x='44.0' y='210.9' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>allow, warn or block. Attackers hide instructions inside the</text>
<text x='44.0' y='241.3' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>transaction itself. Can those instructions change the verdict?</text>
<text x='44.0' y='275.3' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHAT WE DID</text>
<text x='44.0' y='308.5' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>We ran 245 attacks. Hidden orders were planted in the transaction data, in token</text>
<text x='44.0' y='331.7' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>names, in error messages, in address labels — everywhere the assistant reads. The AI</text>
<text x='44.0' y='354.9' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>was set to the worst case: it obeys every instruction it sees.</text>
<text x='44.0' y='384.9' font-size='15' font-weight='700' fill='#13161a' text-anchor='start'>245 attacks against the transaction checker</text>
<text x='266.0' y='437.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Attacks the AI obeyed</text>
<rect x='280.0' y='421.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='421.9' width='480.9' height='22.0' rx='4' fill='#b45309'/>
<text x='820.0' y='437.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>224 of 245</text>
<text x='266.0' y='471.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Verdicts weakened by an attack</text>
<rect x='280.0' y='455.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='455.9' width='2.0' height='22.0' rx='4' fill='#15803d'/>
<text x='820.0' y='471.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>0</text>
<text x='266.0' y='505.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Replies telling the user "go ahead"</text>
<rect x='280.0' y='489.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='489.9' width='169.6' height='22.0' rx='4' fill='#b91c1c'/>
<text x='820.0' y='505.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>79 of 245</text>
<text x='44.0' y='526.9' font-size='12.5' font-weight='400' fill='#5b6472' text-anchor='start'>The verdict is decided by fixed rules the AI cannot reach. The text written around that verdict is not.</text>
<text x='44.0' y='560.9' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHAT WE FOUND</text>
<text x='44.0' y='598.9' font-size='30' font-weight='700' fill='#1d4ed8' text-anchor='start'>The verdict held. The advice did not.</text>
<text x='44.0' y='628.9' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>The attacker never once got a dangerous transaction approved — the final answer</text>
<text x='44.0' y='652.8' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>comes from plain rules the AI has no access to. But in 79 of 245 runs, the sentence</text>
<text x='44.0' y='676.7' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>the user actually reads told them to proceed on a transaction the system had</text>
<text x='44.0' y='700.6' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>blocked.</text>
<text x='44.0' y='734.6' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHY IT MATTERS</text>
<text x='44.0' y='768.6' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>"Zero security failures" would have been a true headline and a misleading one. A</text>
<text x='44.0' y='792.5' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>user who reads the explanation instead of the verdict was told the wrong thing 79</text>
<text x='44.0' y='816.4' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>times.</text>
</svg>
